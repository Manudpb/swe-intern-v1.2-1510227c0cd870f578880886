[project]
name = "claim-triage"
version = "1.0.0"
description = "AI-powered home-damage claim triage service"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "unit: pure functions and single modules",
    "integration: the app through its HTTP surface",
    "contract: validated against api-contract/openapi.yaml",
]
