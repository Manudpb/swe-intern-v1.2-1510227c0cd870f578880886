services:
  # Vector database for storing embedded historical claims
  # You may swap this for another vector DB (Chroma, Pinecone, Weaviate, etc.)
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # Do not assume the upstream image includes curl. Your API should retry the
    # database readiness endpoint at startup and expose its own health check.

  # ==========================================================================
  # YOUR SERVICES BELOW
  # ==========================================================================
  # Add your backend API service, UI service, and any other services you need.
  #
  # Requirements:
  #   - Your API must be accessible on port 8000
  #   - Your UI must be accessible on port 3000
  #   - Your API must expose a GET /api/v1/health endpoint
  #   - The only external dependency should be your LLM API key
  #     (pass PORTKEY_API_KEY, PORTKEY_BASE_URL and LLM_MODEL to the backend)
  #
  # Example:
  #
  # api:
  #   build: ./api
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - PORTKEY_API_KEY=${PORTKEY_API_KEY}
  #     - PORTKEY_BASE_URL=${PORTKEY_BASE_URL}
  #     - LLM_MODEL=${LLM_MODEL}
  #     - QDRANT_URL=http://qdrant:6333
  #   depends_on:
  #     qdrant:
  #       condition: service_started
  #   volumes:
  #     - ./data:/app/data
  #
  # ui:
  #   build: ./ui
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api
  # ==========================================================================

volumes:
  qdrant_data:
